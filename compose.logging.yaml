services:
  loki:
    image: grafana/loki:3.6.8
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./logging/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.6.8
    restart: unless-stopped
    user: "0:0"
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./logging/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    links:
      - loki

volumes:
  loki_data:
  promtail_positions:
